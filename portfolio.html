<style>
:root{
  --dk:#0a0a0a;--d:#111;--cb:#181818;--bdr:#2e2e2e;
  --g:#c8a84b;--gl:#e2c97e;--gd:rgba(200,168,75,.13);
  --t1:#f0ede8;--t2:#888480;--t3:#484440;
  --ffd:'Syne',sans-serif;--ffb:'DM Sans',sans-serif;
  --ease:cubic-bezier(.25,.46,.45,.94);--dur:.36s;--r:30px;
}
*,::after,::before{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--dk);color:var(--t1);font-family:var(--ffb);font-weight:300;line-height:1.7;overflow-x:hidden;min-height:100vh}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
::selection{background:var(--g);color:var(--dk)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--dk)}
::-webkit-scrollbar-thumb{background:var(--g);border-radius:2px}

/* ── TOP BAR ── */
.topbar{
  position:sticky;top:0;z-index:500;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:1.1rem clamp(1.2rem,4vw,3.2rem);
  background:rgba(10,10,10,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--bdr);
  flex-wrap:wrap;
}
.brand{font-family:var(--ffd);font-weight:700;font-size:1.05rem;letter-spacing:-.01em;color:var(--t1)}
.brand span{color:var(--g)}
.topbar-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.btn-o,.btn-g{
  font-family:var(--ffb);font-size:.72rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  padding:.65rem 1.25rem;border-radius:var(--r);display:inline-flex;align-items:center;gap:.45rem;
  transition:all var(--dur) var(--ease);white-space:nowrap;
}
.btn-o{border:1px solid var(--bdr);color:var(--t1);background:transparent}
.btn-o:hover{border-color:var(--g);color:var(--g);background:var(--gd);transform:translateY(-2px)}
.btn-g{background:var(--g);color:var(--dk);border:1px solid var(--g)}
.btn-g:hover{background:transparent;color:var(--g);transform:translateY(-2px)}

/* ── HEADER ── */
.pf-head{padding:4.2rem clamp(1.2rem,4vw,3.2rem) 2.4rem;text-align:center;position:relative;overflow:hidden}
.pf-head::before{
  content:'';position:absolute;top:-40%;left:50%;transform:translateX(-50%);
  width:640px;height:420px;background:radial-gradient(closest-side,rgba(200,168,75,.16),transparent 70%);
  pointer-events:none;
}
.slabel{font-size:.68rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--g);
  display:inline-flex;align-items:center;gap:.5rem;margin-bottom:1rem;position:relative}
.slabel::before,.slabel::after{content:'';display:inline-block;width:1.6rem;height:1px;background:var(--g)}
.pf-title{font-family:var(--ffd);font-weight:800;font-size:clamp(2.1rem,5vw,3.6rem);letter-spacing:-.02em;line-height:1.08;position:relative}
.pf-title .gold{color:var(--g)}
.pf-sub{color:var(--t2);font-size:.94rem;max-width:560px;margin:1.1rem auto 0;position:relative}
.pf-stats{display:flex;gap:2.4rem;justify-content:center;margin-top:2.2rem;flex-wrap:wrap;position:relative}
.pf-stat b{display:block;font-family:var(--ffd);font-size:1.5rem;color:var(--g)}
.pf-stat span{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--t2)}

/* ── FILTERS ── */
.fbts{display:flex;gap:.45rem;flex-wrap:wrap;justify-content:center;margin:2.6rem 0 2.2rem;padding:0 1.2rem}
.fbt{font-family:var(--ffb);font-size:.68rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--bdr);background:0;color:var(--t3);padding:.5rem 1.1rem;border-radius:var(--r);
  cursor:pointer;transition:all var(--dur) var(--ease)}
.fbt.active,.fbt:hover{border-color:var(--g);color:var(--g);background:var(--gd)}

/* ── GRID ── */
.pf-wrap{padding:0 clamp(1.2rem,4vw,3.2rem) 5rem;max-width:1400px;margin:0 auto}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.3rem}
.pc{opacity:0;transform:translateY(28px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.pc.on{opacity:1;transform:translateY(0)}
.pc.hide{display:none}
.pi{position:relative;overflow:hidden;background:var(--cb);border:1px solid var(--bdr);border-radius:var(--r);
  cursor:pointer;transition:border-color var(--dur),transform var(--dur) var(--ease)}
.pi:hover{border-color:rgba(200,168,75,.4);transform:translateY(-4px)}
.pi .pimg-wrap{overflow:hidden;border-radius:var(--r) var(--r) 0 0;aspect-ratio:3/2;background:#eee}
.pi img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;filter:grayscale(.15);
  transition:transform .55s var(--ease),filter .4s ease}
.pi:hover img{transform:scale(1.055);filter:grayscale(0)}
.pi .zoomtag{position:absolute;top:.9rem;right:.9rem;width:34px;height:34px;border-radius:50%;
  background:rgba(10,10,10,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
  color:var(--g);font-size:.85rem;opacity:0;transform:scale(.7);transition:all var(--dur) var(--ease)}
.pi:hover .zoomtag{opacity:1;transform:scale(1)}
.pinfo{padding:1.1rem 1.3rem 1.3rem}
.ptag{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--g);display:flex;align-items:center;gap:.4rem}
.pname{font-family:var(--ffd);font-size:1.08rem;font-weight:700;margin-top:.3rem;color:var(--t1)}
.pdesc{font-size:.78rem;color:var(--t2);margin-top:.35rem;line-height:1.55}
.plink{display:inline-flex;align-items:center;gap:.35rem;font-size:.7rem;color:var(--g);margin-top:.65rem;
  letter-spacing:.03em;opacity:.9}
.plink:hover{text-decoration:underline}

/* ── LIGHTBOX ── */
.lb{position:fixed;inset:0;z-index:1000;background:rgba(6,6,6,.96);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;
  transition:opacity .35s var(--ease);padding:1.5rem}
.lb.open{opacity:1;pointer-events:auto}
.lb-inner{width:100%;max-width:1180px;max-height:92vh;display:flex;flex-direction:column;align-items:center;gap:1rem;
  transform:scale(.94);transition:transform .4s var(--ease);opacity:0}
.lb.open .lb-inner{transform:scale(1);opacity:1}
.lb-frame{position:relative;width:100%;border-radius:18px;overflow:hidden;background:var(--cb);border:1px solid var(--bdr);
  max-height:70vh;display:flex;align-items:center;justify-content:center}
.lb-frame img{width:100%;height:100%;max-height:70vh;object-fit:contain;display:block}
.lb-caption{text-align:center;max-width:640px}
.lb-tag{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--g)}
.lb-name{font-family:var(--ffd);font-weight:700;font-size:1.3rem;margin-top:.35rem}
.lb-desc{font-size:.82rem;color:var(--t2);margin-top:.4rem}
.lb-url{display:inline-flex;align-items:center;gap:.4rem;font-size:.75rem;color:var(--g);margin-top:.6rem}
.lb-url:hover{text-decoration:underline}
.lb-counter{font-size:.68rem;letter-spacing:.1em;color:var(--t3);margin-top:.2rem}

.lb-close,.lb-nav{
  position:fixed;top:0;background:rgba(20,20,20,.7);border:1px solid var(--bdr);color:var(--t1);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--dur) var(--ease);
  z-index:1010;
}
.lb-close{top:1.4rem;right:1.4rem;width:44px;height:44px;border-radius:50%;font-size:1.15rem}
.lb-close:hover{border-color:var(--g);color:var(--g);transform:rotate(90deg)}
.lb-nav{top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;font-size:1.3rem}
.lb-nav:hover{border-color:var(--g);color:var(--g);background:var(--gd)}
.lb-prev{left:1.4rem}
.lb-next{right:1.4rem}
@media(max-width:720px){
  .lb-nav{width:42px;height:42px;font-size:1.05rem}
  .lb-prev{left:.5rem}
  .lb-next{right:.5rem}
  .lb-close{width:38px;height:38px;top:.8rem;right:.8rem}
}

/* ── FOOTER ── */
.pf-foot{border-top:1px solid var(--bdr);padding:2.2rem clamp(1.2rem,4vw,3.2rem);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.fcopy{font-size:.72rem;color:var(--t3)}

@media(max-width:560px){
  .topbar{padding:.9rem 1.1rem}
  .brand{font-size:.9rem}
  .btn-o,.btn-g{padding:.55rem 1rem;font-size:.65rem}
  .pf-stats{gap:1.4rem}
}
</style>
</head>

<script>
document.getElementById('yrf').textContent = new Date().getFullYear();

/* ── PROJECT DATA ── */
const projects = [
  {
    cat: 'website', tag: 'Website Design',
    name: 'Dr. Harikrishna',
    desc: 'Naturopathy & integrative herbal medicine website',
    img: 'assets/img/portfolio/sreehari-kalarickal-app-food-delivery-05.png',
    url: 'https://www.drharikrishna.com'
  },
  {
    cat: 'website', tag: 'Website Design',
    name: 'Najma Mohammed General Trading LLC',
    desc: 'Generator sales, rental, service & repair website',
    img: 'assets/img/portfolio/sreehari-kalarickal-app-food-delivery-06.png',
    url: 'https://www.najmapower.com'
  },
  {
    cat: 'website', tag: 'Website Design',
    name: 'Project 01',
    desc: 'Community giving, donations & volunteering platform',
    img: 'assets/img/portfolio/sreehari-kalarickal-app-food-delivery-07.png',
    url: 'https://www.givegoget.com'
  },
  {
    cat: 'website', tag: 'Website Design',
    name: 'Project 02.com',
    desc: 'Faith formation platform for families, schools & parishes',
    img: 'assets/img/portfolio/sreehari-kalarickal-app-food-cb.png',
    url: 'https://www.catholicbrain.com'
  },
  {
    cat: 'website', tag: 'Website Design',
    name: 'Project 03',
    desc: 'SaaS platform website — enhances your brand online',
    img: 'assets/img/portfolio/sreehari-kalarickal.png',
    url: 'https://www.sitepm.com'
  },
  {
    cat: 'app', tag: 'Mobile App UI',
    name: 'Formato',
    desc: 'All-in-one format converter app — designed in Figma',
    img: 'assets/img/portfolio/sreehari-kalarickal-app-food-delivery-02.png'
  },
  {
    cat: 'app', tag: 'Mobile App UI',
    name: 'RuchiGo',
    desc: 'Food delivery mobile app UI — designed in Figma',
    img: 'assets/img/portfolio/sreehari-kalarickal-app-food-delivery-01.png'
  },
  {
    cat: 'app', tag: 'Mobile App UI',
    name: 'Project 01',
    desc: 'Mobile dictionary app with AI chat & quizzes',
    img: 'assets/img/portfolio/sreehari-kalarickal-app-food-delivery-03.png'
  },
  {
    cat: 'graphic', tag: 'Logo Design',
    name: 'Logo Collection',
    desc: 'Greenroot, Bella Con Estilo, Busy Brushes & OnCart',
    img: 'assets/img/portfolio/sreehari-kalarickal-logo-busy-brushes.png'
  },
  {
    cat: 'graphic', tag: 'Brochure Design',
    name: 'A Faith Formation',
    desc: 'Print brochure design for CatholicBrain',
    img: 'assets/img/portfolio/20180213-Mockup-Catholic-Brain.jpg'
  },
  {
    cat: 'graphic', tag: 'Folding Flyer',
    name: 'Folding Flyer',
    desc: 'Tri-fold flyer design for SitePM',
    img: 'assets/img/portfolio/sreehari-kalarickal-graphic-designs.jpg'
  }
];

/* ── RENDER GRID ── */
const grid = document.getElementById('pfGrid');
grid.innerHTML = projects.map((p, i) => `
  <div class="pc" data-cat="${p.cat}" data-i="${i}" style="transition-delay:${(i % 6) * 0.06}s">
    <div class="pi">
      <div class="pimg-wrap"><img src="${p.img}" alt="${p.name} — ${p.desc}" loading="lazy" width="480" height="320" /></div>
      <span class="zoomtag"><i class="bi bi-arrows-fullscreen"></i></span>
      <div class="pinfo">
        <div class="ptag"><i class="bi bi-dot"></i>${p.tag}</div>
        <div class="pname">${p.name}</div>
        <div class="pdesc">${p.desc}</div>
        ${p.url ? `<span class="plink"><i class="bi bi-globe2"></i> ${p.url.replace('https://','')}</span>` : ''}
      </div>
    </div>
  </div>
`).join('');

/* ── REVEAL ON SCROLL ── */
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); io.unobserve(e.target); } });
}, { threshold: .12 });
document.querySelectorAll('.pc').forEach(el => io.observe(el));

/* ── FILTERS ── */
const fbts = document.querySelectorAll('.fbt');
fbts.forEach(btn => {
  btn.addEventListener('click', () => {
    fbts.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.f;
    document.querySelectorAll('.pc').forEach(card => {
      const show = f === 'all' || card.dataset.cat === f;
      card.classList.toggle('hide', !show);
      if (show) { card.classList.remove('on'); requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add('on'))); }
    });
  });
});

/* ── LIGHTBOX ── */
const lb = document.getElementById('lb');
const lbImg = document.getElementById('lbImg');
const lbTag = document.getElementById('lbTag');
const lbName = document.getElementById('lbName');
const lbDesc = document.getElementById('lbDesc');
const lbUrl = document.getElementById('lbUrl');
const lbCounter = document.getElementById('lbCounter');
let currentIndex = 0;

function openLB(i){
  currentIndex = i;
  renderLB();
  lb.classList.add('open');
  lb.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
}
function closeLB(){
  lb.classList.remove('open');
  lb.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
}
function renderLB(){
  const p = projects[currentIndex];
  lbImg.style.opacity = 0;
  const tmp = new Image();
  tmp.onload = () => { lbImg.src = p.img; lbImg.alt = p.name; requestAnimationFrame(()=> lbImg.style.opacity = 1); };
  tmp.src = p.img;
  lbImg.style.transition = 'opacity .3s ease';
  lbTag.textContent = p.tag;
  lbName.textContent = p.name;
  lbDesc.textContent = p.desc;
  if (p.url) {
    lbUrl.style.display = 'inline-flex';
    lbUrl.href = p.url;
    lbUrl.querySelector('span').textContent = p.url.replace('https://','');
  } else {
    lbUrl.style.display = 'none';
  }
  lbCounter.textContent = `${currentIndex + 1} / ${projects.length}`;
}
function nextLB(){ currentIndex = (currentIndex + 1) % projects.length; renderLB(); }
function prevLB(){ currentIndex = (currentIndex - 1 + projects.length) % projects.length; renderLB(); }

grid.addEventListener('click', (e) => {
  const card = e.target.closest('.pc');
  if (!card) return;
  openLB(parseInt(card.dataset.i, 10));
});

document.getElementById('lbClose').addEventListener('click', closeLB);
document.getElementById('lbNext').addEventListener('click', nextLB);
document.getElementById('lbPrev').addEventListener('click', prevLB);
lb.addEventListener('click', (e) => { if (e.target === lb) closeLB(); });

document.addEventListener('keydown', (e) => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLB();
  if (e.key === 'ArrowRight') nextLB();
  if (e.key === 'ArrowLeft') prevLB();
});

/* swipe support */
let touchStartX = 0;
lb.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, {passive:true});
lb.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].screenX - touchStartX;
  if (Math.abs(dx) > 50) { dx < 0 ? nextLB() : prevLB(); }
}, {passive:true});
</script>
</body>
</html>
