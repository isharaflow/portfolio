<script>
(function () {
  // Paste the "Web app" URL you get from Apps Script -> Deploy -> New deployment.
  var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyNxezd0ETnCZ8t-WXlhJ4QIWcVMFtef7-vvE4t7sT4ph0bIt-W2xJSDl1V6WXX4tuxsg/exec';

  var dateSelect = document.getElementById('dateSelect');
  var msgList    = document.getElementById('msgList');
  var msgCount   = document.getElementById('msgCount');

  // Groups: { 'YYYY-MM-DD': [ record, record, ... ] }, plus a display label per key.
  var groups = {};
  var dateKeys = [];

  function parseTimestamp(raw) {
    // Handles both "yyyy-MM-dd HH:mm:ss" (from the script) and native Date-ish strings.
    var d = new Date(String(raw).replace(' ', 'T'));
    if (isNaN(d.getTime())) d = new Date(raw);
    return isNaN(d.getTime()) ? null : d;
  }

  function dateKeyFor(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function dateLabelFor(d) {
    return d.toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
  }

  function timeLabelFor(d) {
    return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function groupByDate(records) {
    var map = {};
    records.forEach(function (rec) {
      var raw = rec['Timestamp'];
      var d = raw ? parseTimestamp(raw) : null;
      var key = d ? dateKeyFor(d) : 'unknown';
      if (!map[key]) map[key] = { label: d ? dateLabelFor(d) : 'Unknown date', items: [] };
      map[key].items.push(Object.assign({}, rec, { _date: d }));
    });
    return map;
  }

  function populateDateSelect() {
    dateKeys = Object.keys(groups).sort(function (a, b) { return a < b ? 1 : -1; }); // newest first
    dateSelect.innerHTML = '';
    dateKeys.forEach(function (key) {
      var opt = document.createElement('option');
      opt.value = key;
      opt.textContent = groups[key].label + ' (' + groups[key].items.length + ')';
      dateSelect.appendChild(opt);
    });
    dateSelect.disabled = dateKeys.length === 0;
  }

  function renderMessagesForDate(key) {
    var group = groups[key];
    if (!group || !group.items.length) {
      msgList.innerHTML = '<p class="msg-state">No messages for this date.</p>';
      return;
    }

    var items = group.items.slice().sort(function (a, b) {
      if (!a._date || !b._date) return 0;
      return b._date - a._date; // newest first within the day
    });

    msgList.innerHTML = items.map(function (rec) {
      var name    = escapeHtml(rec['Name'] || 'Unknown');
      var email   = escapeHtml(rec['Email'] || '');
      var phone   = escapeHtml(rec['Phone Number'] || '');
      var subject = escapeHtml(rec['Subject'] || '');
      var body    = escapeHtml(rec['Message'] || '');
      var time    = rec._date ? timeLabelFor(rec._date) : '';

      return (
        '<article class="msg-card">' +
          '<div class="msg-card-top">' +
            '<span class="msg-name">' + name + '</span>' +
            '<span class="msg-time">' + time + '</span>' +
          '</div>' +
          (subject ? '<div class="msg-subject">' + subject + '</div>' : '') +
          '<div class="msg-body">' + body + '</div>' +
          '<div class="msg-meta">' +
            (email ? '<a href="mailto:' + email + '">' + email + '</a>' : '') +
            (phone ? '<a href="tel:' + phone + '">' + phone + '</a>' : '') +
          '</div>' +
        '</article>'
      );
    }).join('');
  }

  function updateCount() {
    var total = dateKeys.reduce(function (sum, key) { return sum + groups[key].items.length; }, 0);
    msgCount.textContent = total + (total === 1 ? ' message' : ' messages') + ' across ' + dateKeys.length + (dateKeys.length === 1 ? ' day' : ' days');
  }

  dateSelect.addEventListener('change', function () {
    renderMessagesForDate(dateSelect.value);
  });

  function loadMessages() {
    if (!WEB_APP_URL || WEB_APP_URL.indexOf('PASTE_YOUR') === 0) {
      msgList.innerHTML = '<p class="msg-state">Set WEB_APP_URL in the script to your deployed Apps Script web app URL.</p>';
      return;
    }

    fetch(WEB_APP_URL)
      .then(function (res) {
        if (!res.ok) throw new Error('Request failed: ' + res.status);
        return res.json();
      })
      .then(function (records) {
        if (records && records.error) throw new Error(records.error);
        groups = groupByDate(records || []);
        populateDateSelect();
        updateCount();
        if (dateKeys.length) {
          dateSelect.value = dateKeys[0];
          renderMessagesForDate(dateKeys[0]);
        } else {
          msgList.innerHTML = '<p class="msg-state">No messages yet.</p>';
        }
      })
      .catch(function (err) {
        msgList.innerHTML = '<p class="msg-state">Couldn\'t load messages: ' + escapeHtml(err.message) + '</p>';
      });
  }

  loadMessages();
})();
</script>
<script>

  function onScroll(){
    var scrollTop  = window.scrollY || document.documentElement.scrollTop;
    var docHeight  = document.documentElement.scrollHeight - window.innerHeight;
    var pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
    if (progressBar) progressBar.style.width = pct + '%';
    document.documentElement.style.setProperty('--scroll-pct', pct);
    if (availBadge){
      var show = scrollTop > 260;
      availBadge.classList.toggle('show', show);
      availBadge.setAttribute('aria-hidden', show ? 'false' : 'true');
    }
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', onScroll);
  onScroll();
})();
</script>
